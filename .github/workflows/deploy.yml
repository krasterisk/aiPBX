name: Deploy to Production

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - ".docs/**"
      - ".loki/**"
      - ".agent/**"
  # Ручной запуск с выбором сервера
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - aipbxnet_production
          - aipbxorg_production
          - aipbxru_production

jobs:
  # ─── Step 1: Lint & Test (GAP-01: quality gate) ─────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      # Skip puppeteer Chromium download — quality gate does not prerender
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      - run: npm run lint:ts
      - run: npm run test:unit
      - run: npm run generate:api-types:check
      # - run: npm run lint:scss

  # ─── Step 2: Determine which servers to deploy ──
  prepare:
    name: Prepare Deploy Matrix
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.set-matrix.outputs.servers }}
    steps:
      - name: Set server matrix
        id: set-matrix
        run: |
          # Ручной запуск — используем выбранный target
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.target }}" == "all" ]]; then
              echo 'servers=["aipbxnet_production","aipbxorg_production","aipbxru_production"]' >> $GITHUB_OUTPUT
            else
              echo 'servers=["${{ github.event.inputs.target }}"]' >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Push — парсим commit message
          MSG="${{ github.event.head_commit.message }}"

          if [[ "$MSG" == *"[deploy all]"* ]]; then
            echo "Deploy to all servers"
            echo 'servers=["aipbxnet_production","aipbxorg_production","aipbxru_production"]' >> $GITHUB_OUTPUT
          elif [[ "$MSG" == *"[deploy:1]"* ]]; then
            echo "Deploy only to aipbxnet"
            echo 'servers=["aipbxnet_production"]' >> $GITHUB_OUTPUT
          elif [[ "$MSG" == *"[deploy:2]"* ]]; then
            echo "Deploy only to aipbxorg"
            echo 'servers=["aipbxorg_production"]' >> $GITHUB_OUTPUT
          elif [[ "$MSG" == *"[deploy:3]"* ]]; then
            echo "Deploy only to aipbxru"
            echo 'servers=["aipbxru_production"]' >> $GITHUB_OUTPUT
          else
            echo "No deploy tag found — skipping deployment"
            echo 'servers=[]' >> $GITHUB_OUTPUT
          fi

  # ─── Step 3: Deploy to servers ───────
  deploy:
    name: Deploy (${{ matrix.server }})
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
      fail-fast: false
    environment: ${{ matrix.server }}
    steps:
      - name: Checkout bounded SSH access helper
        if: matrix.server == 'aipbxru_production'
        uses: actions/checkout@v4
      - name: Prepare pinned public builder cache
        if: matrix.server == 'aipbxru_production'
        run: |
          set -euo pipefail
          BASE=ghcr.io/puppeteer/puppeteer:21.11.0
          docker pull --platform linux/amd64 "$BASE@sha256:3eec2cc84995bd9649cef83dbe92faf73ff0c327bdd32f7379d7635b4981968e"
          docker tag "$BASE@sha256:3eec2cc84995bd9649cef83dbe92faf73ff0c327bdd32f7379d7635b4981968e" "$BASE"
          docker save "$BASE" | gzip -1 > "$RUNNER_TEMP/public-frontend-builder.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum public-frontend-builder.tar.gz > public-frontend-builder.tar.gz.sha256
      - name: Prepare temporary SSH access request
        if: matrix.server == 'aipbxru_production'
        env:
          PRODUCTION_HOST: ${{ secrets.SERVER_HOST }}
          PRODUCTION_TARGET: ${{ matrix.server }}
        run: python3 .github/scripts/production-ssh-access.py report
      - name: Publish ephemeral runner address
        if: always() && matrix.server == 'aipbxru_production'
        uses: actions/upload-artifact@v4
        with:
          name: production-ssh-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-ssh-access.json
          retention-days: 1
          if-no-files-found: error
      - name: Wait for bounded SSH access
        if: matrix.server == 'aipbxru_production'
        env:
          PRODUCTION_HOST: ${{ secrets.SERVER_HOST }}
          PRODUCTION_TARGET: ${{ matrix.server }}
        run: python3 .github/scripts/production-ssh-access.py wait
      - name: Upload pinned public builder cache
        if: matrix.server == 'aipbxru_production'
        env:
          PRODUCTION_HOST: ${{ secrets.SERVER_HOST }}
          PRODUCTION_USER: ${{ secrets.SERVER_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: python3 .github/scripts/upload-public-builder.py
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          # script_stop removed in appleboy/ssh-action@v1 — use `set -e` below
          script: |
            set -e
            case "${{ matrix.server }}" in
              aipbxru_production) SITE_URL=https://aipbx.ru ;;
              aipbxnet_production) SITE_URL=https://aipbx.net ;;
              aipbxorg_production) SITE_URL=https://aipbx.org ;;
              *) echo "Unknown deployment target" >&2; exit 1 ;;
            esac
            echo "Starting deployment to ${{ matrix.server }}..."

            cd /app

            if [[ "${{ matrix.server }}" == "aipbxru_production" ]]; then
              CACHE_DIR=/tmp/aipbx-frontend-builder-${{ github.run_id }}-${{ github.run_attempt }}
              (cd "$CACHE_DIR" && sha256sum -c public-frontend-builder.tar.gz.sha256)
              sudo docker load -i "$CACHE_DIR/public-frontend-builder.tar.gz"
              rm -- "$CACHE_DIR/public-frontend-builder.tar.gz" "$CACHE_DIR/public-frontend-builder.tar.gz.sha256"
              rmdir -- "$CACHE_DIR"
            fi

            # ── Mark repo as safe (Git 2.35.2+ ownership check) ──
            git config --global --add safe.directory /app/aiPBX

            # ── Fix ownership so current user can pull and deploy ──
            sudo chown -R $(whoami) /app/aiPBX
            sudo chown $(whoami) /app/.env.production /app/docker-compose.production.yml

            # ── Pull latest code ──
            echo "Pulling frontend..."
            cd /app/aiPBX && git pull origin master

            cd /app

            # ── Build & deploy ──
            echo "Building and deploying frontend..."
            sudo env DEPLOY_SITE_URL="$SITE_URL" docker compose \
              -f docker-compose.production.yml \
              -f /app/aiPBX/deploy/frontend-site.override.yml \
              --env-file .env.production up -d \
              --build \
              --no-deps \
              --force-recreate frontend \
              --remove-orphans

            # ── Wait for startup ──
            echo "Waiting for services to start..."
            sleep 10

            # ── Verify deployment ──
            echo "Checking containers..."
            sudo docker compose -f docker-compose.production.yml --env-file .env.production ps frontend

            # ── Cleanup (prevent disk space accumulation) ──
            echo "Cleaning up old images and build cache..."
            sudo docker image prune -a -f
            sudo docker builder prune -f --keep-storage=2GB
            echo "Docker disk usage after cleanup:"
            sudo docker system df
            echo "Deployment to ${{ matrix.server }} successful!"
